<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>Stop watch</title>
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body>
        <div class="stopwatch">
            <div class="timerDisplay">00:00:00</div>
        </div>
        <div class="button">
            <button id="start" class="btn" style="background-color: green;">START</button>
            <button id="reset" class="btn" style="background-color:red">RESET</button>
            <button id="lap" class="btn" style="background-color: blue;">LAP</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
